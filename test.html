<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Library UI</title>
    <!-- CSS ගොනුව සම්බන්ධ කිරීම -->
    <link rel="stylesheet" href="test.css">
</head>
<body>

<div class="container">
    
    <!-- Header කොටස -->
    <div class="box header">
        <h1>Bookkk Library</h1>
    </div>

    <!-- Navigation කොටස -->
    <div class="box gray-box">
        Browse · Genres · My Shelf
    </div>

    <!-- පොත් පෙන්වන Grid එක -->
    <div class="grid">
        <!-- පළමු පොත -->
        <div class="card">
            <h2>The Village</h2>
            <p>Rs. 1200 · In stock</p>
            <button class="btn">♥ Save</button>
        </div>
        
        <!-- දෙවන පොත -->
        <div class="card">
            <h2>Paddy Fields</h2>
            <p>Rs. 950 · Out of stock</p>
            <button class="btn">♥ Save</button>
        </div>
    </div>

    <!-- ලියාපදිංචි වීමේ Form එක -->
    <div class="box gray-box">
        <div class="form-content">
            Join the library: 
            Name [ <input type="text" class="input-field"> ] 
            Email [ <input type="text" class="input-field"> ] 
            [ Register ]
        </div>
    </div>

    <!-- Footer කොටස -->
    <div class="box footer">
        © HICT 22013
    </div>

</div>

</body>
</html>
